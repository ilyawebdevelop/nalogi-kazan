<!-- modal -->
<!-- order -->
<div class="modal" id="modalOrder">

  <div class="modalHead">
    <h2 class="h2">Заказать индивидуальный расчёт</h2>
    <button data-fancybox-close class="f-button is-close-btn" title="Close"><svg xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24" tabindex="-1">
        <path d="M20 20L4 4m16 0L4 20"></path>
      </svg>
    </button>
  </div>

  <div class="modalContent">
    <p class="modalDescr">
      Оставьте свои контакты, и мы подготовим персональное предложение
      для вашей компании
    </p>
    <div class="modalForm">
      <div class="inputW mb-10">
        <input type="text" class="formInput border-outline" placeholder="Как вас зовут?">
      </div>
      <div class="inputW mb-50">
        <input type="tel" class="formInput border-outline" placeholder="+7 (___) ___-__-__" inputmode="text">
      </div>
      <div class="d-grid grid-column-3 grid-column-sm-2 mb-10 gap-10 socialsForm">
        <div class="col">
          <input id="tel_order_modal" type="radio" name="modalSocials" checked>
          <label for="tel_order_modal">Звонок</label>
        </div>
        <div class="col">
          <input id="teleg_order_modal" type="radio" name="modalSocials">
          <label for="teleg_order_modal">Telegram</label>
        </div>
        <div class="col">
          <input id="max_order_modal" type="radio" name="modalSocials">
          <label for="max_order_modal">Max</label>
        </div>
      </div>
      <div class="inputW mb-20">
        <input type="tel" class="formInput border-outline" placeholder="Укажите ваш номер телефона">
      </div>
      <div class="agreementFlex mb-15">
        <div class="agreement">
          <div class="agreementW">
            <input id="orderAgreeModal" type="checkbox" checked>
            <label for="orderAgreeModal">
              <div class="rect"></div>
              <div class="agreementText color-gray2">
                Я соглашаюсь с <a href="#">Политикой обработки персональных данных</a> и <a href="#">Политикой
                  конфиденциальности</a>
              </div>
            </label>
          </div>
        </div>
        <button class="button button--dark-blue orderForm">
          Получить консультацию
        </button>
      </div>
    </div>
  </div>
</div>
