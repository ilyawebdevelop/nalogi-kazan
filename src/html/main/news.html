<section class="news sect pt-0 sliderW">
  <div class="container">

    <div class="sectHead">
      <h2 class="h2">
        Будьте в курсе
      </h2>
    </div>

    <div class="newsNav">
      <button class="button button--blue">
        Читать все новости
      </button>
      <div class="navArrowW">
        <button class="navArrow navArrowPrev" type="button">
          <img src="@img/icons/arrow-prev.svg" alt="icon">
        </button>
        <button class="navArrow navArrowNext" type="button">
          <img src="@img/icons/arrow-next.svg" alt="icon">
        </button>
      </div>
    </div>

    <div class="swiper newsSlider">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          @@include('../news/card-1.html',{})
        </div>
        <div class="swiper-slide">
          @@include('../news/card-2.html',{})
        </div>
        <div class="swiper-slide">
          @@include('../news/card-3.html',{})
        </div>
        <div class="swiper-slide">
          @@include('../news/card-4.html',{})
        </div>
      </div>
    </div>

  </div>
</section>
