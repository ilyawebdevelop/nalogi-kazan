<section class="order sect pt-0">
  <div class="container">
    <div class="orderW">
      <div class="col">
        <h2 class="h2">
          Заказать индивидуальный расчёт
        </h2>
        <p class="color-white fz-md-14">
          Оставьте свои контакты, и мы подготовим персональное предложение
          для вашей компании
        </p>
      </div>
      <div class="col">
        <div class="orderForm">
          <div class="inputW mb-10">
            <input type="text" class="formInput" placeholder="Ваше имя">
          </div>
          <div class="inputW mb-20">
            <input type="text" class="formInput" placeholder="Компания">
          </div>
          <div class="input-name mb-10">Выберите удобный вид связи:</div>
          <div class="d-grid grid-column-3 mb-10 gap-10 gap-sm-5 socialsForm">
            <div class="col">
              <input id="order_tel" type="radio" name="calcSocials" checked>
              <label for="order_tel">Звонок</label>
            </div>
            <div class="col">
              <input id="order_teleg" type="radio" name="calcSocials">
              <label for="order_teleg">Telegram</label>
            </div>
            <div class="col">
              <input id="order_max" type="radio" name="calcSocials">
              <label for="order_max">Max</label>
            </div>
          </div>
          <div class="inputW mb-20">
            <input type="tel" class="formInput" placeholder="Укажите ваш номер телефона">
          </div>

          <div class="agreementFlex">
            <div class="agreement">
              <div class="agreementW">
                <input id="orderAgree" type="checkbox" checked>
                <label for="orderAgree">
                  <div class="rect"></div>
                  <div class="agreementText">
                    Я соглашаюсь с <a href="#">Политикой обработки персональных данных</a> и <a href="#">Политикой
                      конфиденциальности</a>
                  </div>
                </label>
              </div>
            </div>
            <button class="button button-sm-w-100 button-sm-fz-14 button--dark-blue orderForm">
              Получить консультацию
            </button>
          </div>

        </div>
      </div>

    </div>
  </div>
</section>
